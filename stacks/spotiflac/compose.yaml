services:
  spotiflac:
    image: ghcr.io/johnnyy775/spotiflac-docker:latest
    container_name: spotiflac
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam # Change to your timezone
      - WEB_LISTENING_PORT=5800
      - VNC_LISTENING_PORT=-1
      - WEB_FILE_MANAGER=1
      - WEB_FILE_MANAGER_ALLOWED_PATHS=/downloads
      #- DISPLAY_WIDTH=1280
      #- DISPLAY_HEIGHT=720
      - KEEP_APP_RUNNING=1
    volumes:
      - /var/lib/spotiflac:/config       # App settings and internal data
      - /mnt/warehouse/incomplete:/downloads # Map this to your music library
    ports:
      - 3002:5800
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped