---
services:
  firefox:
    image: lscr.io/linuxserver/firefox:latest
    container_name: firefox
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - FIREFOX_CLI=https://www.linuxserver.io/ #optional
    volumes:
      - /var/lib/firefox:/config
    ports:
      - 3010:3000
      - 3011:3001
    shm_size: "1gb"
    restart: unless-stopped
